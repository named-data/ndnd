merkle:
  # [required] Name of the Merkle history log service
  name: /ndnd/merkle
  # [required] Directory for the packet cache and persistent log
  storage_dir: /etc/ndn/merkle/storage
  # [required] Keychain URI for security
  # - Example: dir:///absolute/path/to/keychain
  keychain: "dir:///etc/ndn/merkle/keys"
  # [required] Compiled LVS trust schema for log requests and responses
  trust_schema: /etc/ndn/merkle/schema.tlv
  # [required] Full names of validation trust anchors
  trust_anchors:
    - "/ndn/KEY/%27%C4%B2%2A%9F%7B%81%27/ndn/v=1651246789556"
